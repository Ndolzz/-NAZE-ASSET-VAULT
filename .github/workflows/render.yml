name: NAZE Render

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Nama proyek di PROJECTS/ (mis. STYLE-SHOWCASE)'
        required: false
        default: 'STYLE-SHOWCASE'
      profile:
        description: 'Profil render'
        required: false
        default: 'vertical-1080'
        type: choice
        options:
          - vertical-1080
          - vertical-1440
          - vertical-2160
  push:
    branches: [main]
    paths:
      - 'PROJECTS/**'
      - 'MOTION-ENGINE/**'
      - 'naze.policy.json'
      - '.github/workflows/render.yml'

permissions:
  contents: write

concurrency:
  group: naze-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Render NAZE
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instal ffmpeg dan espeak-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          ffmpeg -version | head -n 1
          espeak-ng --version | head -n 1

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instal dependensi engine
        working-directory: MOTION-ENGINE
        run: npm install

      - name: Uji Adaptive Caption Engine
        working-directory: MOTION-ENGINE
        run: |
          set -o pipefail
          npx tsx src/captions/caption-tests.ts 2>&1 | tee "${{ github.workspace }}/caption-tests.log"

      - name: Tentukan proyek
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROJECTS="${{ inputs.project }}"
          else
            # Hanya merender satu proyek yang sedang dikerjakan.
            # Ganti ke proyek aktif berikutnya saat produksi berpindah.
            PROJECTS="AI-TECH-WAR"
          fi
          PROFILE="${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'vertical-1080' }}"
          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "Proyek: $PROJECTS | Profil: $PROFILE"

      - name: Render video
        working-directory: MOTION-ENGINE
        env:
          NAZE_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -o pipefail
          echo "=== NAZE render mulai ==="
          for PROJECT in ${{ steps.cfg.outputs.projects }}; do
            echo "--- Render proyek: $PROJECT ---"
            npx tsx src/cli.ts render "../PROJECTS/$PROJECT" \
              --out "${{ github.workspace }}/dist/$PROJECT" \
              --profile "${{ steps.cfg.outputs.profile }}" 2>&1 | tee "${{ github.workspace }}/render-output-$PROJECT.log"
          done

      - name: Publikasikan log render saat gagal
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "${{ github.workspace }}"
          LOGS=$(ls render-output-*.log caption-tests.log 2>/dev/null || true)
          if [ -z "$LOGS" ]; then echo "Log render tidak ditemukan."; exit 0; fi
          {
            echo "## Log render NAZE (gagal)"
            echo ""
            echo "Baris log terakhir (maks. 150 per berkas):"
            echo ""
            for LOG in $LOGS; do
              echo "### $LOG"
              echo ""
              echo '=== LOG-START ==='
              tail -n 150 "$LOG"
              echo '=== LOG-END ==='
            done
          } >> "$GITHUB_STEP_SUMMARY"
          BRANCH="render-logs/${{ github.run_id }}-${{ github.run_attempt }}"
          API="https://api.github.com/repos/${{ github.repository }}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/json" \
            "$API/git/refs" \
            -d "{\"ref\":\"refs/heads/$BRANCH\",\"sha\":\"${{ github.sha }}\"}")
          echo "Buat branch $BRANCH: HTTP $HTTP (422 = sudah ada, lanjut)"
          for LOG in $LOGS; do
            CONTENT=$(base64 -w0 "$LOG")
            cat > /tmp/log-commit.json <<EOF
          {"message":"Log render gagal: $LOG (run ${{ github.run_id }} attempt ${{ github.run_attempt }})","content":"$CONTENT","branch":"$BRANCH"}
          EOF
            curl -s -X PUT \
              -H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/json" \
              --data @/tmp/log-commit.json \
              "$API/contents/RENDER-LOGS/${{ github.run_id }}-${{ github.run_attempt }}-$LOG" | head -c 300
            echo ""
          done

      - name: Unggah log render (artifact diagnostik)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naze-render-log-${{ github.run_id }}
          path: |
            render-output-*.log
            caption-tests.log
          if-no-files-found: warn

      - name: Inspeksi hasil dengan ffprobe
        run: |
          set -e
          for PROJECT in ${{ steps.cfg.outputs.projects }}; do
            OUT="dist/$PROJECT/$PROJECT.mp4"
            echo "== ffprobe: $OUT =="
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate,avg_frame_rate \
              -of default=noprint_wrappers=1 "$OUT"
            ffprobe -v error -select_streams a:0 \
              -show_entries stream=codec_name,sample_rate,channels \
              -of default=noprint_wrappers=1 "$OUT"
          done
          echo "== File output =="
          ls -la dist/*/

      - name: Verifikasi laporan render
        run: |
          node -e '
          const fs = require("fs");
          for (const project of "${{ steps.cfg.outputs.projects }}".split(/\s+/).filter(Boolean)) {
            const reportPath = `dist/${project}/render-report.json`;
            const report = JSON.parse(fs.readFileSync(reportPath, "utf-8"));
            const failed = report.validation.checks.filter((c) => !c.pass);
            if (failed.length > 0) {
              console.error(`VALIDASI GAGAL: ${project}`);
              for (const c of failed) console.error(` - ${c.id}: ${c.detail}`);
              process.exit(1);
            }
            console.log(`${project}: validasi lolos ${report.validation.checks.length} pemeriksaan.`);
            console.log(`${project}: durasi ${report.duration.toFixed(2)}s | ${report.frames} frame | ${report.illustrations.total} ilustrasi | engine narasi ${report.narrationEngine}`);
          }
          '

      - name: Unggah artifact
        uses: actions/upload-artifact@v4
        with:
          name: naze-render-all
          path: |
            dist/**
            !dist/**/work/**
          retention-days: 30
          if-no-files-found: error

      - name: Status akhir
        run: echo "Render selesai dan seluruh validasi otomatis lolos."
