name: NAZE 3D Render

on:
  push:
    paths:
      - 'NAZE-3D/**'
      - '.github/workflows/render-3d.yml'
  workflow_dispatch:

concurrency:
  group: naze-3d
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        working-directory: NAZE-3D
        run: npm install
      - name: QA suite
        working-directory: NAZE-3D
        run: |
          set -o pipefail
          node tests/qa.js --outDir ../RENDER-3D/qa 2>&1 | tee "${GH_WORKSPACE}/qa-3d.log"
        env:
          GH_WORKSPACE: ${{ github.workspace }}
      - name: Render demo videos
        working-directory: NAZE-3D
        run: |
          set -o pipefail
          node cli.js --demo all --frames 36 --fps 12 --width 360 --height 640 --outDir ../RENDER-3D/demos 2>&1 | tee "${GH_WORKSPACE}/demos-3d.log"
        env:
          GH_WORKSPACE: ${{ github.workspace }}
      - name: Publikasikan log saat gagal
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_WORKSPACE: ${{ github.workspace }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          cd "${GH_WORKSPACE}"
          BRANCH="render-logs/${GH_RUN_ID}-${GH_RUN_ATTEMPT}"
          API="https://api.github.com/repos/${GH_REPO}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/json" "$API/git/refs" -d "{\"ref\":\"refs/heads/$BRANCH\",\"sha\":\"$GH_SHA\"}")
          echo "Buat branch $BRANCH: HTTP $HTTP (422 = sudah ada, lanjut)"
          for LOG in qa-3d.log demos-3d.log; do
            [ -f "$LOG" ] || continue
            CONTENT=$(base64 -w0 "$LOG")
            cat > /tmp/log-commit.json <<EOF
          {"message":"Log 3D gagal: $LOG (run $GH_RUN_ID attempt $GH_RUN_ATTEMPT)","content":"$CONTENT","branch":"$BRANCH"}
          EOF
            curl -s -X PUT -H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/json" --data @/tmp/log-commit.json "$API/contents/RENDER-LOGS/${GH_RUN_ID}-${GH_RUN_ATTEMPT}-$LOG" | head -c 300
            echo ""
          done
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naze-3d-render
          path: RENDER-3D/
          retention-days: 14
          if-no-files-found: warn
