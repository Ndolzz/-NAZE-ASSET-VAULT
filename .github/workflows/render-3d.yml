name: NAZE 3D Render

on:
  push:
    paths:
      - 'NAZE-3D/**'
      - '.github/workflows/render-3d.yml'
  workflow_dispatch:

concurrency:
  group: naze-3d
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        working-directory: NAZE-3D
        run: npm install
      - name: QA suite
        working-directory: NAZE-3D
        run: |
          set -o pipefail
          node tests/qa.js --outDir ../RENDER-3D/qa 2>&1 | tee "${GH_WORKSPACE}/qa-3d.log"
        env:
          GH_WORKSPACE: ${{ github.workspace }}
      - name: Render demo videos
        working-directory: NAZE-3D
        run: |
          set -o pipefail
          node cli.js --demo all --frames 36 --fps 12 --width 360 --height 640 --outDir ../RENDER-3D/demos 2>&1 | tee "${GH_WORKSPACE}/demos-3d.log"
        env:
          GH_WORKSPACE: ${{ github.workspace }}
      - name: Publikasikan log saat gagal
        if: failure()
        env:
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          BRANCH="render-logs/${GH_RUN_ID}-${GH_RUN_ATTEMPT}"
          git config user.name "naze-ci"
          git config user.email "naze-ci@users.noreply.github.com"
          git checkout -B "$BRANCH"
          mkdir -p RENDER-LOGS/qa
          cp -f qa-3d.log demos-3d.log RENDER-LOGS/ 2>/dev/null || true
          cp -f RENDER-3D/qa/qa-report.json RENDER-3D/qa/catalog.json RENDER-LOGS/qa/ 2>/dev/null || true
          cp -f RENDER-3D/qa/*.png RENDER-LOGS/qa/ 2>/dev/null || true
          git add -f RENDER-LOGS
          git commit -m "Log render 3D gagal (run ${GH_RUN_ID} attempt ${GH_RUN_ATTEMPT})" || true
          git push origin "$BRANCH" || echo "push log gagal"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naze-3d-render
          path: RENDER-3D/
          retention-days: 14
          if-no-files-found: warn
