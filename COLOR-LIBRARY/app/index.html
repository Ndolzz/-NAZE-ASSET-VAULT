:root{--bg:#f4f3ef;--sf:#fff;--tx:#17171a;--mu:#62626b;--bd:#dcdad2;--ac:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--sf:#1c1c20;--tx:#f1f0ec;--mu:#9b9ba5;--bd:#2d2d33;--ac:#fb923c}}
:root[data-theme="dark"]{--bg:#121214;--sf:#1c1c20;--tx:#f1f0ec;--mu:#9b9ba5;--bd:#2d2d33;--ac:#fb923c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:72px}
header{padding:16px 16px 8px}h1{margin:0;font:800 22px/1.1 Georgia,serif;letter-spacing:-.5px}h1 span{color:var(--ac)}
.sub{color:var(--mu);font-size:13px;margin-top:4px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:12px 2px;font:600 12px system-ui}nav button.on{color:var(--ac);box-shadow:inset 0 2px var(--ac)}
main{padding:0 16px;max-width:900px;margin:auto}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);font:inherit;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:99px;padding:6px 12px;font-size:13px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;margin:10px 0;overflow:hidden}
.sw{display:flex;height:64px}.sw i{flex:1}
.cb{padding:12px}.cb h3{margin:0;font-size:16px}.tag{font-size:12px;color:var(--mu)}
.btn{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:9px;padding:8px 11px;font:600 13px system-ui}.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.ok{color:#15803d;font-weight:700}.no{color:#b91c1c;font-weight:700}
@media (prefers-color-scheme:dark){.ok{color:#4ade80}.no{color:#f87171}}
.hex{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}.hex b{width:18px;height:18px;border-radius:5px;border:1px solid var(--bd)}
.pv{padding:14px;border-radius:12px;margin-top:8px}.pv .bt{display:inline-block;padding:8px 14px;border-radius:8px;font-weight:700;margin-top:8px}
.grad{height:110px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;transition:.2s;z-index:9}.toast.on{opacity:1}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.stat div{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px}.stat b{font-size:22px;display:block}

// ===== COLOR MATH =====
const h2r=h=>[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));
const r2h=r=>r.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
function r2hsl([r,g,b]){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2,d=M-m;let h=0,s=0;
 if(d){s=d/(1-Math.abs(2*l-1));h=M==r?((g-b)/d)%6:M==g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360}return[h,s*100,l*100]}
function hsl2h(h,s,l){h=((h%360)+360)%360;s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;
 const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
 return r2h([f(0),f(8),f(4)].map(v=>v*255))}
const lum=h=>{const[r,g,b]=h2r(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
const cr=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const fmt=(h,k)=>{const r=h2r(h);if(k=="hex")return"#"+h.toUpperCase();if(k=="rgb")return`rgb(${r.join(", ")})`;const[a,b,c]=r2hsl(r);return`hsl(${Math.round(a)}, ${Math.round(b)}%, ${Math.round(c)}%)`};
const chk=(a,b,min)=>{const v=cr(a,b);return`<span class="${v>=min?"ok":"no"}">${v.toFixed(2)}:1 ${v>=min?"PASS":"FAIL"}</span>`};

function cp(s){(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast("Tersalin"),()=>{const a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Tersalin")}catch(e){toast("Gagal menyalin")}a.remove()})}
window.cp=cp;
function tog(k,id){const a=S[k],i=a.indexOf(id);if(i>=0)a.splice(i,1);else{if(k=="cmp"&&a.length>=4)return toast("Maksimal 4 palet");a.push(id)}if(k=="fav")sv("nz-fav",a);render()}

function cssVars(p){return":root{\n"+ROLES.map((r,i)=>`  --${r.replace(".","-")}: #${p.c[i]};`).join("\n")+"\n}"}
function paletteJSON(p){const o={id:p.id,name:p.name,category:p.cat,tokens:{}};ROLES.forEach((r,i)=>o.tokens[r]="#"+p.c[i]);return JSON.stringify(o,null,2)}
function preview(p){const[b,s,t,pr,ac]=p.c;return`<div class="pv" style="background:${"#"+b};color:${"#"+t}"><b style="font-size:17px">Judul Halaman</b><div style="opacity:.8">Teks isi contoh di atas latar dasar.</div>
<div style="background:#${s};padding:10px;border-radius:9px;margin-top:8px">Kartu permukaan <span style="color:#${ac};font-weight:700">• aksen</span></div>
<span class="bt" style="background:#${pr};color:#${lum(pr)>.4?"000000":"ffffff"}">Tombol Utama</span></div>`}
function detail(p){const[b,s,t,pr,ac]=p.c;
 const rows=[["Teks / latar",t,b,4.5],["Primer / latar (tombol)",pr,b,3],["Aksen / latar",ac,b,3],["Teks / permukaan",t,s,4.5]];
 const fails=rows.filter(r=>cr(r[1],r[2])<r[3]);
 return`<div class="cb" style="border-top:1px solid var(--bd)">`+p.c.map((h,i)=>`<div class="hex"><b style="background:#${h}"></b><span style="flex:1"><b style="all:unset;font-weight:700">${ROLES[i]}</b><br>${["hex","rgb","hsl"].map(k=>`<a href="#" onclick="cp('${fmt(h,k)}');return false" style="color:var(--ac)">${fmt(h,k)}</a>`).join(" · ")}</span></div>`).join("")
 +`<h4 style="margin:12px 0 4px">Kontras WCAG 2.2 AA</h4><div class="scroll"><table>`+rows.map(r=>`<tr><td>${r[0]}</td><td>${chk(r[1],r[2],r[3])}</td></tr>`).join("")+`</table></div>`
 +(fails.length?`<div class="tag" style="margin-top:6px">Rekomendasi: untuk pasangan yang gagal, pakai warna ini hanya untuk elemen dekoratif atau teks besar (min 3:1), atau gelapkan/terangkan warna foreground. Warna asli tidak diubah.</div>`:"")
 +preview(p)+`<div class="row" style="margin-top:10px"><button class="btn" onclick='cp(${JSON.stringify(p.c.map(h=>"#"+h).join(", "))})'>Salin HEX</button><button class="btn" onclick='cp(${JSON.stringify(cssVars(p))})'>Salin CSS</button><button class="btn" onclick='cp(${JSON.stringify(paletteJSON(p))})'>Salin JSON</button></div></div>`}

function pcard(p){const f=S.fav.includes(p.id),c=S.cmp.includes(p.id);
 return`<div class="card"><div class="sw" onclick="S.open=S.open=='${p.id}'?null:'${p.id}';render()">${p.c.map(h=>`<i style="background:#${h}"></i>`).join("")}</div>
 <div class="cb"><div class="row" style="align-items:center;flex-wrap:nowrap"><div><h3>${p.name}</h3><div class="tag">${p.cat} · ${p.tags.join(" · ")}</div></div>
 <button class="btn" style="flex:none;min-width:0" onclick="tog('fav','${p.id}')">${f?"★":"☆"}</button><button class="btn ${c?"p":""}" style="flex:none;min-width:0" onclick="tog('cmp','${p.id}')">${c?"✓":"+"} Bandingkan</button></div></div>${S.open==p.id?detail(p):""}</div>`}

const V={
font(){const q=S.fq.toLowerCase(),pm={};all().forEach(p=>pm[p.id]=p);
 const FK={s:"Georgia,serif",n:"system-ui,sans-serif",m:"ui-monospace,Menlo,monospace"},ff=(f,k)=>"'"+f+"',"+FK[k];

  const p=pm[t[10]],hc=p.c[ROLES.indexOf(t[11])],bc=p.c[2],bg=p.c[0],lk=p.c[3],hf=ff(t[3],t[4]),bf=ff(t[8],t[9]);
  const css=`:root{\n  --font-heading: ${hf};\n  --font-body: ${bf};\n  --color-heading: #${hc};\n  --color-body: #${bc};\n  --color-link: #${lk};\n}\nh1,h2{font-family:var(--font-heading);font-weight:${t[5]};letter-spacing:${t[6]};text-transform:${t[7]};color:var(--color-heading)}`.replace(/'/g,'"');
  return`<div class="card"><div class="pv" style="background:#${bg};color:#${bc};margin:0;border-radius:0;font-family:${bf}"><div style="font-family:${hf};font-weight:${t[5]};letter-spacing:${t[6]};text-transform:${t[7]};color:#${hc};font-size:24px;line-height:1.2">Warna &amp; Tipografi</div><p style="margin:8px 0 0">Teks isi memakai peran text.primary di atas latar dasar. <span style="color:#${lk};text-decoration:underline">Tautan contoh</span></p></div>
  <div class="cb"><h3>${t[1]}</h3><div class="tag">${t[2]} · ${t[3]} + ${t[8]} · palet ${p.name}</div>
  <div style="font-size:13px;margin-top:6px">Judul (${t[11]}): ${chk(hc,bg,t[11].startsWith("text")?4.5:3)}<br>Isi (text.primary): ${chk(bc,bg,4.5)}<br>Tautan (brand.primary): ${chk(lk,bg,4.5)}</div>
  <div class="row" style="margin-top:8px"><button class="btn" onclick='cp(${JSON.stringify(css)})'>Salin CSS</button></div></div></div>`}).join("")},
dash(){const cats=[...new Set(P.map(p=>p.cat))];return`<div class="stat"><div><b>${all().length}</b>Palet solid</div><div><b>${G.length}</b>Gradien</div><div><b>${cats.length}</b>Kategori</div></div>
<div class="tag">Target awal 60 palet dan 60 gradien sudah tercapai. Data kustom: ${S.custom.length}, favorit: ${S.fav.length}.</div>
<h3>Koleksi terbaru</h3>`+P.slice(-3).map(pcard).join("")+`<h3>Favorit</h3>`+(S.fav.length?all().filter(p=>S.fav.includes(p.id)).map(pcard).join(""):`<div class="tag">Belum ada favorit.</div>`)},
solid(){const cats=["Semua",...new Set(P.map(p=>p.cat))],q=S.q.toLowerCase().replace("#","");
 const l=all().filter(p=>(S.cat=="Semua"||p.cat==S.cat)&&(!q||(p.name+p.cat+p.tags.join(" ")).toLowerCase().includes(q)||p.c.some(h=>h.includes(q))));
 return`<input placeholder="Cari nama, tag, atau HEX…" value="${S.q}" oninput="S.q=this.value;render(1)"><div class="chips">${cats.map(c=>`<button class="chip ${S.cat==c?"on":""}" onclick="S.cat='${c}';render()">${c}</button>`).join("")}</div>`+(l.map(pcard).join("")||`<div class="tag">Tidak ada hasil.</div>`)},
grad(){const ts=["Semua",...new Set(G.map(g=>g.type))];
 return`<div class="chips">${ts.map(c=>`<button class="chip ${S.gt==c?"on":""}" onclick="S.gt='${c}';render()">${c}</button>`).join("")}</div>`+G.filter(g=>S.gt=="Semua"||g.type==S.gt).map(g=>`<div class="card"><div class="grad" style="background:${g.css};color:${g.tx};padding:12px;font-weight:700">${g.name}<div style="font-weight:400;font-size:13px">Teks cocok: ${g.tx}</div></div><div class="cb"><div class="tag">${g.type} · ${g.id}</div><code style="font-size:12px;word-break:break-all">${g.css}</code><div style="margin-top:8px"><button class="btn" onclick='cp(${JSON.stringify("background: "+g.css+";")})'>Salin CSS</button></div></div></div>`).join("")},
gen(){const h=S.gen.replace("#","").toLowerCase(),ok=/^[0-9a-f]{6}$/.test(h);
 let o=`<input id="gi" value="${S.gen}" placeholder="#RRGGBB atau rgb(...) atau hsl(...)" onchange="parseGen(this.value)"><div class="tag">Input HEX, rgb(r,g,b), atau hsl(h,s%,l%). Hasil tidak mengubah katalog sampai kamu menyimpannya.</div>`;
 if(!ok)return o+`<div class="no">Format warna tidak valid.</div>`;
 const[H,Sa,L]=r2hsl(h2r(h)),sw=a=>`<div class="sw" style="height:48px">${a.map(x=>`<i style="background:#${x};cursor:pointer" onclick="cp('#${x}')"></i>`).join("")}</div>`;
 const scale=[95,88,78,66,54,42,30,20,12].map(l=>hsl2h(H,Sa,l)),
 har={Complementary:[H,H+180],Analogous:[H-30,H,H+30],"Split complementary":[H,H+150,H+210],Triadic:[H,H+120,H+240],Tetradic:[H,H+90,H+180,H+270]};
 o+=`<div class="card"><div class="cb"><b>Skala warna</b>${sw(scale)}<div class="tag">Ketuk swatch untuk salin. ${fmt(h,"hex")} · ${fmt(h,"rgb")} · ${fmt(h,"hsl")}</div></div></div>`;
 o+=`<div class="card"><div class="cb"><b>Harmoni</b>`+Object.entries(har).map(([k,v])=>`<div class="tag" style="margin-top:8px">${k}</div>${sw(v.map(x=>hsl2h(x,Sa,L)))}`).join("")+`</div></div>`;
 const g=`linear-gradient(135deg,#${hsl2h(H-20,Sa,L+12)} 0%,#${h} 50%,#${hsl2h(H+25,Sa,L-18)} 100%)`;
 o+=`<div class="card"><div class="grad" style="background:${g}"></div><div class="cb"><code style="font-size:12px">${g}</code><div class="row" style="margin-top:8px"><button class="btn" onclick='cp(${JSON.stringify("background: "+g+";")})'>Salin CSS</button></div></div></div>`;
 o+=`<div class="card"><div class="cb"><b>Kontras</b><div>Putih di atas warna ini: ${chk("ffffff",h,4.5)}</div><div>Hitam di atas warna ini: ${chk("000000",h,4.5)}</div><button class="btn p" style="margin-top:10px" onclick="saveGen()">Simpan sebagai palet kustom</button></div></div>`;return o},
cmp(){const l=all().filter(p=>S.cmp.includes(p.id));if(l.length<2)return`<div class="tag">Pilih 2 sampai 4 palet lewat tombol "+ Bandingkan" di tab Palet.</div>`+l.map(pcard).join("");
 return`<div class="scroll"><table><tr><th></th>${l.map(p=>`<th>${p.name}</th>`).join("")}</tr>
 <tr><td>Swatch</td>${l.map(p=>`<td><div class="sw" style="height:34px;width:130px">${p.c.map(h=>`<i style="background:#${h}"></i>`).join("")}</div></td>`).join("")}</tr>
 <tr><td>Kategori</td>${l.map(p=>`<td>${p.cat}</td>`).join("")}</tr><tr><td>Karakter</td>${l.map(p=>`<td>${p.tags.join(", ")}</td>`).join("")}</tr>
 <tr><td>Teks/latar</td>${l.map(p=>`<td>${chk(p.c[2],p.c[0],4.5)}</td>`).join("")}</tr>
 <tr><td>Primer/latar</td>${l.map(p=>`<td>${chk(p.c[3],p.c[0],3)}</td>`).join("")}</tr>
 <tr><td>Aksen/latar</td>${l.map(p=>`<td>${chk(p.c[4],p.c[0],3)}</td>`).join("")}</tr></table></div>`+l.map(p=>preview(p)).join("")},
fav(){const l=all().filter(p=>S.fav.includes(p.id));return(l.length?l.map(pcard).join(""):`<div class="tag">Belum ada favorit. Ketuk ☆ pada palet.</div>`)+`<div class="row" style="margin-top:12px"><button class="btn" onclick='cp(JSON.stringify(S.fav))'>Ekspor ID favorit</button><button class="btn" onclick="impFav()">Impor</button></div>`}
};
window.parseGen=v=>{v=v.trim();let m;
 if(m=v.match(/^#?([0-9a-f]{6})$/i))S.gen="#"+m[1].toLowerCase();
 else if(m=v.match(/^rgb\(\s*(\d+)\D+(\d+)\D+(\d+)/i))S.gen="#"+r2h([+m[1],+m[2],+m[3]]);
 else if(m=v.match(/^hsl\(\s*([\d.]+)\D+([\d.]+)\D+([\d.]+)/i))S.gen="#"+hsl2h(+m[1],+m[2],+m[3]);
 else S.gen=v;render()};
window.saveGen=()=>{const h=S.gen.replace("#","");const[H,Sa]=r2hsl(h2r(h));
 const c=[hsl2h(H,Math.min(Sa,25),96),hsl2h(H,Math.min(Sa,25),90),hsl2h(H,Math.min(Sa,30),12),hsl2h(H,Sa,35),hsl2h(H+180,Sa,40)];
 S.custom.push({id:"custom-"+h+"-"+Date.now().toString(36),name:"Kustom #"+h.toUpperCase(),cat:"Kustom",c,tags:["generated"]});
 sv("nz-custom",S.custom);toast("Disimpan sebagai entri baru");render()};

(function(){const SG=["DM Serif Display","Press Start 2P","Bebas Neue","Pacifico","Rubik Mono One"],f=new Set();T.forEach(t=>{f.add(t[3]);f.add(t[8])});
 const q=[...f].map(n=>"family="+n.replace(/ /g,"+")+(SG.includes(n)?"":":wght@400;700")).join("&"),l=document.createElement("link");

const TABS=[["dash","Beranda"],["solid","Palet"],["grad","Gradien"],["font","Font"],["gen","Gen"],["cmp","Banding"],["fav","Fav"]];

 if(f){const i=m.querySelector("input");if(i){i.focus();i.setSelectionRange(pos,pos)}}}
